# ============================================================================
# 单域名 + 路径前缀（§2.2）
#   为什么不用子域名：微信小程序 request 合法域名有数量上限，
#   100 个租户 = 100 个子域名是不可维护的。
# ============================================================================

upstream snack_api {
    server api:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    charset utf-8;
    client_max_body_size 20m;        # Excel 批量导入（含楼栋列）

    # ---- 小程序端统一入口：AppID → 租户，全部走同一域名 ----
    location /api/ {
        proxy_pass http://snack_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---- 兜底路径前缀：/t/{tenant_code}/api/...（AppID 不可用时的退路） ----
    location ~ ^/t/[A-Za-z0-9_-]+/api/ {
        proxy_pass http://snack_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- 商户网页后台（/admin） ----
    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    # ---- 平台后台（/platform）—— 四色中性，永不接受租户主题色（AC-12） ----
    location /platform/ {
        alias /usr/share/nginx/html/platform/;
        try_files $uri $uri/ /platform/index.html;
        # 平台后台只允许内网 / 白名单访问；公网暴露前必须接入真实账号体系
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }

    location / {
        return 404;
    }

    # 小程序端不需要 CORS：同域请求
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
}
